<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="notes for cs447">
    <title>cs447 notes | drnfns</title>
    <link rel="stylesheet" href="https://unpkg.com/missing.css@1.2.0">
    <link
      rel="stylesheet"
      href="https://unpkg.com/missing.css@1.2.0/dist/missing-prism.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css"
    >
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/default.min.css"
    >
    <script
      defer
      src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/highlightjs-riscvasm@0.1.0/index.min.js"
    ></script>
  </head>
  <body>
    <main style="padding: 1em; max-width: 72ch; margin: auto">
      <noscript>
        <section class="warn box">
          <strong class="titlebar">warning</strong>
          <p>
            looks like you have javascript disabled: syntax highlighting and
            math elements may not render properly.
          </p>
        </section>
      </noscript>
      {{content}}
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true },
          ],
        });
        hljs.highlightAll();
      });
    </script>
  </body>
</html>
